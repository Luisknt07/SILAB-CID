name: Validación continua

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_DOTENV_DISABLED: "1"
  PYTHONUNBUFFERED: "1"
  UV_PYTHON: "3.11"

jobs:
  sistema:
    name: Django, arquitectura y JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Rol elevado exclusivamente en este contenedor efímero, para crear y
    # clonar las bases de pruebas de Django. No es el rol de producción.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: citt_ci
          POSTGRES_USER: citt_ci
          POSTGRES_PASSWORD: ci-example-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citt_ci -d citt_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-centros:
        image: postgres:17
        env:
          POSTGRES_DB: citt_qa_ci_centros
          POSTGRES_USER: citt_ci_centros
          POSTGRES_PASSWORD: ci-example-only-centros-password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U citt_ci_centros -d citt_qa_ci_centros"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-example-only-django-key-never-use-in-production-2026
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: citt_ci
      DB_USER: citt_ci
      DB_PASSWORD: ci-example-only-postgres-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      # Algunas pruebas de integración consultan explícitamente ambos alias.
      # Registrar el destino no activa el router ni mueve datos de Centros.
      CENTROS_DB_ENABLED: "false"
      CENTROS_DB_NAME: citt_qa_ci_centros
      CENTROS_DB_USER: citt_ci_centros
      CENTROS_DB_PASSWORD: ci-example-only-centros-password
      CENTROS_DB_HOST: 127.0.0.1
      CENTROS_DB_PORT: "5434"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SITE_URL: http://testserver
      MPLBACKEND: Agg
      TZ: America/Guayaquil
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Instalar el entorno fijado en uv.lock
        run: uv sync --locked --dev --no-install-project
      - name: Verificar requirements con hashes y sin cambios del lock
        run: |
          mkdir -p var/ci
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --no-header --output-file var/ci/requirements.txt
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          actual = Path('requirements.txt').read_text().splitlines()
          cabecera = '# This file was autogenerated by uv via the following command:'
          if actual and actual[0] == cabecera:
              assert len(actual) > 2 and actual[1].startswith('#    uv ')
              actual = actual[2:]
          esperado = Path('var/ci/requirements.txt').read_text().splitlines()
          assert actual == esperado, 'requirements.txt no corresponde a uv.lock (versiones, marcadores y hashes).'
          PY
          git diff --exit-code -- uv.lock
      - name: Verificar aislamiento de configuración
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from django.conf import settings
          assert os.environ['PYTHON_DOTENV_DISABLED'] == '1'
          assert settings.DATABASES['default']['NAME'] == 'citt_ci'
          assert settings.DATABASES['default']['HOST'] == '127.0.0.1'
          assert settings.TEST_RUNNER == 'config.testing.PruebasAisladas'
          assert not any('MD5' in h for h in settings.PASSWORD_HASHERS)
          assert settings.EMAIL_BACKEND == 'django.core.mail.backends.locmem.EmailBackend'
          print('Base efímera, media temporal del runner y hashers normales verificados.')
          PY
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Comprobar Django y detectar migraciones pendientes
        run: |
          uv run --no-sync python manage.py check --fail-level WARNING
          uv run --no-sync python manage.py makemigrations --check --dry-run
      - name: Auditar arquitectura, contratos, plantillas y archivos
        run: |
          uv run --no-sync python scripts/auditar_repositorio.py --estricto
          uv run --no-sync python manage.py auditar_modulos
          uv run --no-sync python manage.py auditar_contratos_senales --resumen --estricto
          uv run --no-sync python manage.py auditar_plantillas
          uv run --no-sync python manage.py auditar_huerfanos --estricto
      - name: Pruebas JavaScript
        run: node --test tests/integration/js/*.cjs
      - name: Integridad de entregas e inventario de almacenamiento
        run: uv run --no-sync python -m unittest scripts.tests.test_entregas -v
      - name: Pruebas Django con PostgreSQL 17 y archivos temporales
        # config.testing.PruebasAisladas crea MEDIA_ROOT temporal. Django crea
        # test_citt_ci y sus clones; nunca se usa una base institucional.
        # Dependencias efímeras de QA: trazas paralelas e inspección del PDF.
        run: uv run --no-sync --with tblib==3.2.2 --with PyMuPDF==1.28.2 python manage.py test tests scripts.tests apps --parallel 4 --noinput --verbosity 1

      - name: Separación física Centros y copia verificada en dos PostgreSQL efímeros
        env:
          DJANGO_SETTINGS_MODULE: config.settings_testing_multibase
          DB_NAME: citt_qa_ci_principal
          CENTROS_DB_ENABLED: "true"
          CENTROS_DB_NAME: citt_qa_ci_centros
          CENTROS_DB_USER: citt_ci_centros
          CENTROS_DB_PASSWORD: ci-example-only-centros-password
          CENTROS_DB_HOST: 127.0.0.1
          CENTROS_DB_PORT: "5434"
        run: >-
          uv run --no-sync --with PyMuPDF==1.28.2 python manage.py test config.tests_multibase
          apps.centros_id.tests --noinput --verbosity 1

      - name: Módulo opcional de conexiones físico-digitales
        # Apagado por defecto: sus modelos, migraciones y pruebas solo existen
        # cuando la instalación lo activa, y así se comprueban aquí.
        env:
          SLCID_MODULO_CONEXIONES: "true"
        run: |
          uv run --no-sync python manage.py makemigrations --check --dry-run
          uv run --no-sync python manage.py test apps.conexiones --noinput --verbosity 1

  dependencias:
    name: Vulnerabilidades de dependencias Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.8"
          enable-cache: false
      - name: Auditar contra avisos vigentes de PyPI
        # Herramienta aislada: no instala paquetes en el entorno de la app.
        # Una caída de red o un hallazgo hace fallar el control; no se ocultan.
        run: >-
          uv tool run --isolated --from pip-audit==2.10.1 pip-audit
          --require-hashes --disable-pip --strict --progress-spinner off
          --timeout 30 -r requirements.txt
