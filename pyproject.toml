[project]
name = "slcid"
version = "0.1.0"
description = "Sistema de Laboratorios y Centros de Investigación y Desarrollo (SLCID): producto configurable por institución"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asgiref==3.12.1",
    "certifi==2026.10.18",
    "cffi==2.1.1",
    "charset-normalizer==3.5.1",
    "cryptography==50.0.1",
    "defusedxml==0.7.1",
    "django==5.2.17",
    "django-allauth==65.19.3",
    "django-grappelli==5.0.0",
    "django-guardian==3.5.0",
    "idna==3.19",
    "matplotlib==3.11.2",
    "oauthlib==4.0.1",
    "pillow==13.0.0",
    "psycopg2-binary==2.9.13",
    "pycparser==3.0",
    "pyjwt==2.15.0",
    "python-dotenv==1.2.3",
    "python3-openid==3.2.0",
    "reportlab==5.0.1",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "whitenoise==6.12.0",
    "sqlparse==0.6.0",
    "tzdata==2026.4",
    "urllib3==2.8.0",
    "waitress==3.0.2",
    "openpyxl==3.1.5",
    "pypdf==6.21.4",
]

# Herramientas de desarrollo: no se instalan en la imagen de produccion.
[dependency-groups]
dev = [
    "ruff==0.15.0",
]

[tool.ruff]
# Mantener los archivos temporales de análisis fuera del código de las apps.
cache-dir = "var/cache/ruff"
