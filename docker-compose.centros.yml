# Preparación/corte optativo: docker compose -f docker-compose.yml -f docker-compose.centros.yml ...
# CENTROS_DB_ENABLED=false prepara el destino; true SOLO después de copiar y verificar.
services:
  db-centros:
    container_name: slcid-base-datos-centros-investigacion
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    image: postgres:17
    restart: always
    volumes:
      - postgres_centros_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${CENTROS_DB_NAME:?Configure nombre distinto para Centros}
      POSTGRES_USER: ${CENTROS_DB_MIGRATION_USER:?Configure rol propietario Centros}
      POSTGRES_PASSWORD: ${CENTROS_DB_MIGRATION_PASSWORD:?Configure clave propietaria Centros}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    environment:
      CENTROS_DB_HOST: db-centros
      CENTROS_DB_PORT: "5432"
      CENTROS_DB_NETWORK_ISOLATED: "true"
    depends_on:
      db-centros:
        condition: service_healthy

  web:
    environment:
      CENTROS_DB_HOST: db-centros
      CENTROS_DB_PORT: "5432"
      CENTROS_DB_NETWORK_ISOLATED: "true"
    depends_on:
      db-centros:
        condition: service_healthy

  scheduler:
    environment:
      CENTROS_DB_HOST: db-centros
      CENTROS_DB_PORT: "5432"
      CENTROS_DB_NETWORK_ISOLATED: "true"
    depends_on:
      db-centros:
        condition: service_healthy

  microproyectos:
    environment:
      CENTROS_DB_HOST: db-centros
      CENTROS_DB_PORT: "5432"
      CENTROS_DB_NETWORK_ISOLATED: "true"
    depends_on:
      db-centros:
        condition: service_healthy

  backup-centros:
    container_name: slcid-respaldos-centros-investigacion
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    # Activar después de aprovisionar el rol, no al preparar un destino vacío.
    profiles: ["centros-backup"]
    image: postgres:17
    restart: always
    tmpfs:
      - /var/lib/postgresql/data:size=16m,mode=0700
    depends_on:
      migrate:
        condition: service_completed_successfully
      db-centros:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_HOST_DIR:-./var/backups}:/backups
    environment:
      DB_NAME: ${CENTROS_DB_NAME:?Configure nombre distinto para Centros}
      DB_USER: ${CENTROS_DB_BACKUP_USER:?Configure rol respaldo Centros}
      DB_PASSWORD: ${CENTROS_DB_BACKUP_PASSWORD:?Configure clave respaldo Centros}
      DB_HOST: db-centros
      DB_PORT: "5432"
      BACKUP_DIR: /backups/centros
      BACKUP_INCLUDE_MEDIA: "false"
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_VERIFY_RESTORE: ${BACKUP_VERIFY_RESTORE:-true}
    entrypoint: ["sh", "/scripts/docker_backup_loop.sh"]

volumes:
  postgres_centros_data:
