<span class="citt-admin-category__icon is-{{ icon }}" aria-hidden="true">

      <rect x="3" y="3" width="7" height="7" rx="1"></rect>
      <rect x="14" y="3" width="7" height="7" rx="1"></rect>
      <rect x="3" y="14" width="7" height="7" rx="1"></rect>
      <rect x="14" y="14" width="7" height="7" rx="1"></rect>
    {% elif icon == "calendar" %}
      <rect x="3" y="5" width="18" height="16" rx="2"></rect>
      <path d="M7 3v4M17 3v4M3 10h18M7 14h3M14 14h3M7 18h3"></path>
    {% elif icon == "building" %}
      <path d="M4 21V7l8-4 8 4v14M2 21h20M8 9h2M14 9h2M8 13h2M14 13h2M8 17h2M14 17h2"></path>
    {% elif icon == "equipment" %}

      <path d="m4 7 8-4 8 4-8 4-8-4Zm0 0v10l8 4 8-4V7M12 11v10"></path>
    {% elif icon == "services" %}
      <path d="M3 17h18M5 17l2-7h10l2 7M9 10V6h6v4M8 21h8"></path>

      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"></path>
      <path d="M14 2v6h6M8 13h8M8 17h6"></path>

      <path d="m2 9 10-5 10 5-10 5L2 9Zm4 2v5c3 3 9 3 12 0v-5M21 10v6"></path>

      <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>

    {% elif icon == "production" %}
      <path d="M3 21V10l6 4v-4l6 4V6l6 4v11H3ZM7 17h2M12 17h2M17 17h2"></path>
    {% elif icon == "shield" %}
      <path d="M12 3 20 6v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3ZM9 12l2 2 4-4"></path>
    {% elif icon == "users" %}
      <circle cx="9" cy="8" r="3"></circle>
      <circle cx="17" cy="9" r="2"></circle>
      <path d="M3 20c0-4 2-7 6-7s6 3 6 7M15 14c4 0 6 2 6 6"></path>
    {% else %}
      <path d="M12 3 21 8v8l-9 5-9-5V8l9-5Zm0 5v8M8 10l4-2 4 2"></path>
    {% endif %}
