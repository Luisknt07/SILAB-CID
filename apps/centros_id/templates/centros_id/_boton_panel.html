{% if boton.externo %}<a class="cid-recurso{% if boton.imagen %} con-miniatura{% endif %}" href="{{ boton.url }}" target="_blank" rel="noopener" data-id="{{ boton.id }}" title="{{ boton.detalle|default:boton.nombre }}">{% if boton.imagen %}<img class="cid-recurso__miniatura" src="{{ boton.imagen }}" alt="" loading="lazy">{% else %}<i class="{{ boton.icono }}" aria-hidden="true"></i>{% endif %}<span class="cid-recurso__texto"><strong>{{ boton.nombre }}</strong>{% if boton.subtitulo %}<small>{{ boton.subtitulo }}</small>{% endif %}</span><i class="fas fa-external-link-alt" aria-hidden="true"></i></a>
{% else %}<button type="button" class="cid-recurso{% if boton.imagen %} con-miniatura{% endif %}" data-url="{{ boton.url }}" data-id="{{ boton.id }}" data-titulo="{{ boton.nombre }}" title="{{ boton.detalle|default:boton.nombre }}">{% if boton.imagen %}<img class="cid-recurso__miniatura" src="{{ boton.imagen }}" alt="" loading="lazy">{% else %}<i class="{{ boton.icono }}" aria-hidden="true"></i>{% endif %}<span class="cid-recurso__texto"><strong>{{ boton.nombre }}</strong>{% if boton.subtitulo %}<small>{{ boton.subtitulo }}</small>{% endif %}</span><i class="fas fa-chevron-right" aria-hidden="true"></i></button>{% endif %}
