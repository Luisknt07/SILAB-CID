{% load i18n %}<ul class="cidg-filas">{% for fila in registros %}<li><a href="{{ fila.url }}" data-gestion-navegar><div><strong>{{ fila.titulo }}</strong>{% if fila.detalle %}<small>{{ fila.detalle }}</small>{% endif %}</div>{% if fila.estado %}<span class="cidg-estado">{{ fila.estado }}</span>{% endif %}<i class="fas fa-chevron-right" aria-hidden="true"></i></a></li>{% empty %}<li class="cidg-vacio">{% translate 'No hay registros para esta consulta.' %}</li>{% endfor %}</ul>
