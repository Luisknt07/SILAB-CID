{% load i18n %}<button type="button" class="unit-console__row-action" data-agenda-operation-open="software" data-field-registro_id="{{ programa.pk }}" data-field-nombre="{{ programa.nombre }}" data-field-codigo="{{ programa.codigo }}" data-field-version="{{ programa.version }}" data-field-tipo_recurso="{{ programa.tipo_recurso }}" data-field-tipo_acceso="{{ programa.tipo_acceso }}" data-field-descripcion="{{ programa.descripcion }}" data-field-licencias_totales="{{ programa.licencias_totales }}" data-field-licencias_disponibles="{{ programa.licencias_disponibles }}" data-field-equipos_instalados="{{ programa.equipos_instalados_ids_csv }}" data-field-instrucciones_acceso="{{ programa.instrucciones_acceso }}" data-field-requiere_reserva="{{ programa.requiere_reserva|yesno:'true,false' }}" data-field-activo="{{ programa.activo|yesno:'true,false' }}" aria-label="{% translate 'Editar' %} {{ programa.nombre }}"><i class="fas fa-pen" aria-hidden="true"></i> {% translate "Editar" %}</button>
