<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabaja con IA en cambios pequeños</title><desc id="descripcion">La respuesta del asistente se acepta después de comprobarla</desc>
<rect x="0" y="0" width="1200" height="144" rx="0" fill="#122d2a"/>
<text x="42" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffda50">APLICACIONES LOGÍSTICAS CON IA</text>
<text x="42" y="85" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Trabaja con IA en cambios pequeños</text>
<text x="42" y="131" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#c9ded6">La respuesta del asistente se acepta después de comprobarla</text>
<rect x="40" y="180" width="350" height="220" rx="18" fill="#ffffff" stroke="#d4e1db" stroke-width="2"/>
<rect x="40" y="180" width="8" height="220" rx="3" fill="#24623c"/>
<circle cx="80" cy="220" r="21" fill="#24623c"/>
<text x="71" y="226" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">1</text>
<text x="115" y="225" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#24623c">1. Define</text>
<text x="64" y="289" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">Una necesidad y una prueba</text>
<text x="64" y="320" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">concreta.</text>
<rect x="425" y="180" width="350" height="220" rx="18" fill="#ffffff" stroke="#d4e1db" stroke-width="2"/>
<rect x="425" y="180" width="8" height="220" rx="3" fill="#087c87"/>
<circle cx="465" cy="220" r="21" fill="#087c87"/>
<text x="456" y="226" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">2</text>
<text x="500" y="225" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087c87">2. Planifica</text>
<text x="449" y="289" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">Revisa qué archivos</text>
<text x="449" y="320" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">cambiaría.</text>
<rect x="810" y="180" width="350" height="220" rx="18" fill="#ffffff" stroke="#d4e1db" stroke-width="2"/>
<rect x="810" y="180" width="8" height="220" rx="3" fill="#3266af"/>
<circle cx="850" cy="220" r="21" fill="#3266af"/>
<text x="841" y="226" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">3</text>
<text x="885" y="225" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#3266af">3. Modifica</text>
<text x="834" y="289" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">Acepta una mejora cada vez.</text>
<rect x="40" y="430" width="350" height="220" rx="18" fill="#ffffff" stroke="#d4e1db" stroke-width="2"/>
<rect x="40" y="430" width="8" height="220" rx="3" fill="#7451ac"/>
<circle cx="80" cy="470" r="21" fill="#7451ac"/>
<text x="71" y="476" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">4</text>
<text x="115" y="475" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7451ac">4. Comprueba</text>
<text x="64" y="539" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">Prueba desde la pantalla y</text>
<text x="64" y="570" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">con tests.</text>
<rect x="425" y="430" width="350" height="220" rx="18" fill="#ffffff" stroke="#d4e1db" stroke-width="2"/>
<rect x="425" y="430" width="8" height="220" rx="3" fill="#24623c"/>
<circle cx="465" cy="470" r="21" fill="#24623c"/>
<text x="456" y="476" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">5</text>
<text x="500" y="475" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#24623c">5. Decide</text>
<text x="449" y="539" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">Conserva el cambio o vuelve</text>
<text x="449" y="570" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">atrás.</text>
<rect x="810" y="430" width="350" height="220" rx="18" fill="#ffffff" stroke="#d4e1db" stroke-width="2"/>
<rect x="810" y="430" width="8" height="220" rx="3" fill="#087c87"/>
<circle cx="850" cy="470" r="21" fill="#087c87"/>
<text x="841" y="476" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">6</text>
<text x="885" y="475" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087c87">6. Registra</text>
<text x="834" y="539" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">Guarda la versión y la</text>
<text x="834" y="570" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">evidencia.</text>
<line x1="40" y1="704" x2="1160" y2="704" stroke="#d4e1db" stroke-width="2" stroke-linecap="round"/>
<text x="42" y="739" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4c6662">La cantidad de código no es la meta: explica qué cambió y cómo sabes que funciona.</text>
</svg>