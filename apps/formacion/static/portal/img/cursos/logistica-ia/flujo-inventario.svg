<text x="834" y="299" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">Permiso, cantidad positiva y</text>
<text x="834" y="330" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">saldo suficiente.</text>
