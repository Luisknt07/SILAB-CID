<text x="449" y="299" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">Entrada o salida, cantidad y</text>
<text x="449" y="330" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">motivo.</text>
