<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Una operación, una comprobación</title><desc id="descripcion">La pantalla informa; el servidor valida; el historial deja evidencia</desc>
