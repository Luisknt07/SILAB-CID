<text x="115" y="235" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#24623c">Producto</text>
<text x="64" y="299" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#122d2a">Un código único y una</text>
