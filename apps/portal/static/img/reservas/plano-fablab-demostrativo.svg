<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Plano demostrativo del Laboratorio de Manufactura Digital</title>
  <desc id="desc">Distribución referencial de recepción, diseño digital, impresión 3D, corte láser, mecanizado CNC y escaneo 3D.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf8"/>
      <stop offset="1" stop-color="#e8f1ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#153c2d" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d5a72e"/>
    </marker>
    <style>
      .zone{stroke:#2f6f51;stroke-width:4;rx:24;filter:url(#shadow)}
      .name{font:700 27px Arial,sans-serif;fill:#163a2d}
      .meta{font:500 18px Arial,sans-serif;fill:#557064}
      .code{font:800 15px Arial,sans-serif;fill:#9a711a;letter-spacing:2px}
      .icon{font:700 40px Arial,sans-serif;fill:#fff}
      .door{stroke:#153c2d;stroke-width:8;stroke-linecap:round}
      .route{fill:none;stroke:#d5a72e;stroke-width:7;stroke-linecap:round;stroke-dasharray:15 13;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="55" y="55" width="1490" height="790" rx="40" fill="#fff" stroke="#173f30" stroke-width="10"/>
  <text x="95" y="112" class="code">LAYOUT DEMOSTRATIVO · FABLAB UPEC</text>
  <text x="95" y="153" class="name" style="font-size:34px">Distribución de áreas y circulación segura</text>

  <g transform="translate(90 195)">
    <rect class="zone" width="290" height="185" fill="#eef6f1"/>
    <circle cx="58" cy="58" r="34" fill="#2f6f51"/><text x="46" y="71" class="icon">1</text>
    <text x="105" y="57" class="code">ACCESO</text><text x="35" y="115" class="name">Recepción</text>
    <text x="35" y="148" class="meta">Registro e inducción</text>
  </g>
  <g transform="translate(430 195)">
    <rect class="zone" width="500" height="185" fill="#edf5fa"/>
    <circle cx="58" cy="58" r="34" fill="#27658a"/><text x="46" y="71" class="icon">2</text>
    <text x="105" y="57" class="code">DISEÑO</text><text x="35" y="115" class="name">Diseño y preparación digital</text>
    <text x="35" y="148" class="meta">CAD · laminado · revisión de archivos</text>
  </g>
  <g transform="translate(980 195)">
    <rect class="zone" width="525" height="185" fill="#fff7df"/>
    <circle cx="58" cy="58" r="34" fill="#c09220"/><text x="46" y="71" class="icon">3</text>
    <text x="105" y="57" class="code">FABRICACIÓN ADITIVA</text><text x="35" y="115" class="name">Impresión 3D</text>
    <text x="35" y="148" class="meta">FDM · resina · acabado inicial</text>
  </g>

  <g transform="translate(90 440)">
    <rect class="zone" width="400" height="310" fill="#fff1e9"/>
    <circle cx="58" cy="58" r="34" fill="#a85a35"/><text x="46" y="71" class="icon">4</text>
    <text x="105" y="57" class="code">CORTE</text><text x="35" y="120" class="name">Corte y grabado láser</text>
    <text x="35" y="155" class="meta">Preparación de materiales</text>
    <rect x="35" y="190" width="330" height="80" rx="14" fill="#fff" stroke="#ddb9a6" stroke-width="3"/>
    <text x="60" y="225" class="code">ZONA CONTROLADA</text><text x="60" y="252" class="meta">Extracción y seguridad</text>
  </g>
  <g transform="translate(550 440)">
    <rect class="zone" width="500" height="310" fill="#eaf3ee"/>
    <circle cx="58" cy="58" r="34" fill="#245c43"/><text x="46" y="71" class="icon">5</text>
    <text x="105" y="57" class="code">MECANIZADO</text><text x="35" y="120" class="name">Fresado y mecanizado CNC</text>
    <text x="35" y="155" class="meta">Mesa de preparación · herramientas</text>
    <path d="M65 205h370v65H65z" fill="#fff" stroke="#a9c7b6" stroke-width="3"/>
    <circle cx="115" cy="238" r="17" fill="#2f6f51"/><circle cx="195" cy="238" r="17" fill="#2f6f51"/><circle cx="275" cy="238" r="17" fill="#2f6f51"/><circle cx="355" cy="238" r="17" fill="#2f6f51"/>
  </g>
  <g transform="translate(1110 440)">
    <rect class="zone" width="395" height="310" fill="#f1eff8"/>
    <circle cx="58" cy="58" r="34" fill="#66558b"/><text x="46" y="71" class="icon">6</text>
    <text x="105" y="57" class="code">CAPTURA</text><text x="35" y="120" class="name">Escaneo 3D</text>
    <text x="35" y="155" class="meta">Digitalización y revisión</text>
    <circle cx="195" cy="230" r="58" fill="#fff" stroke="#b9add2" stroke-width="4"/>
    <path d="M195 185v90M150 230h90" stroke="#66558b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <path class="route" d="M225 398 C380 405 400 420 470 420 C700 420 790 405 955 405 C1190 405 1280 410 1310 425"/>
  <path class="door" d="M735 845h130"/>
  <text x="694" y="820" class="code">SALIDA Y RUTA DE EVACUACIÓN</text>
  <g transform="translate(1220 790)"><rect width="270" height="40" rx="20" fill="#173f30"/><text x="22" y="27" style="font:700 16px Arial,sans-serif;fill:#fff">Plano de prueba · administrable</text></g>
</svg>
