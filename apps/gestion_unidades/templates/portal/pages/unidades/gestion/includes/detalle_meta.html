{% load reportes_estilo %}<div class="meta-detalle" data-reporte-informacion>
  <button type="button" class="meta-detalle__consulta" data-reporte-informacion-abrir data-modal-titulo="Detalle y evidencias · {{ indicador.nombre|default:nombre }}" aria-haspopup="dialog" aria-label="Consultar detalle y evidencias de {{ indicador.nombre|default:nombre }}">
    <span class="meta-detalle__resumen">{% if indicador.pendiente %}Ver motivo{% elif indicador.faltante %}Faltan {{ indicador.faltante }}{% elif indicador.excedente %}Meta superada{% elif indicador.estado == 'Cumple' %}Meta alcanzada{% else %}Ver detalle{% endif %}</span>
    {% if forloop.first and anexo.automatizacion.vigente and anexo.automatizacion.estado == 'automatico' %}<i class="fas fa-check-circle meta-detalle__control is-correcto" title="Control automático correcto" aria-label="Control automático correcto"></i>{% elif forloop.first and anexo.automatizacion.vigente and anexo.automatizacion.estado == 'bloqueado' %}<i class="fas fa-exclamation-circle meta-detalle__control is-bloqueado" title="Hay bloqueos documentales" aria-label="Hay bloqueos documentales"></i>{% endif %}
    {% if indicador.fuentes %}<span class="meta-detalle__fuentes" title="{{ indicador.fuentes|length }} fuentes"><i class="fas fa-paperclip" aria-hidden="true"></i> {{ indicador.fuentes|length }}</span>{% endif %}
    <i class="fas fa-external-link-alt meta-detalle__abrir" aria-hidden="true"></i>
  </button>
  <template data-reporte-informacion-contenido>
    <dl class="meta-detalle__medicion"><div><dt>Indicador</dt><dd>{{ indicador.indicador|default:nombre }}</dd></div><div><dt>Meta</dt><dd>{{ indicador.meta|default:'Sin definir' }}</dd></div><div><dt>Registrado</dt><dd>{{ indicador.registrado|default_if_none:'Sin medición' }}{% if indicador.denominador %} de {{ indicador.denominador }} verificados{% endif %}</dd></div><div><dt>Estado</dt><dd>{{ indicador.estado }}</dd></div></dl>
    {% if indicador.motivo %}<p>{{ indicador.motivo }}</p>{% elif indicador.pendiente %}<p>Falta una medición verificable.</p>{% endif %}
    {% if indicador.faltante %}<p>Faltan {{ indicador.faltante }} para la meta.</p>{% elif indicador.excedente %}<p>Supera la meta en {{ indicador.excedente }}.</p>{% elif indicador.estado == 'Cumple' %}<p>Meta alcanzada con los registros disponibles.</p>{% endif %}
    {% if forloop.first %}{% if unidad|es_unidad_auditable or documento_principal.unidad|es_unidad_auditable %}{% include 'portal/pages/unidades/gestion/includes/control_automatico.html' with control=anexo.automatizacion %}{% endif %}{% endif %}
    {% if indicador.fuentes %}<h3>Fuentes y evidencias ({{ indicador.fuentes|length }})</h3><ul class="reporte-informacion-fuentes">{% for fuente in indicador.fuentes %}{% if fuente.metodo == 'uso-capacidad-1' %}{% firstof fuente.titulo fuente.codigo 'Registros de uso y capacidad' as titulo_fuente %}{% else %}{% firstof fuente.titulo fuente.codigo 'Registros del sistema' as titulo_fuente %}{% endif %}<li>{% if fuente.recurso %}<a href="{% url 'respaldo_meta_unidad' documento_principal.unidad.slug fuente.evidencia %}" {% if fuente.es_pdf %}data-ver-pdf data-pdf-titulo="{{ titulo_fuente }}"{% else %}download{% endif %}>{% if not fuente.es_pdf %}Descargar: {% endif %}{{ titulo_fuente }}</a>{% elif fuente.enlace %}<a href="{{ fuente.enlace }}" target="_blank" rel="noopener">{{ titulo_fuente }}</a>{% else %}{{ titulo_fuente }}{% endif %}</li>{% endfor %}</ul>{% endif %}
    {% if indicador.fuente_editable and not modo_admin and not solo_lectura and documento_principal.estado != 'validado' %}<p><a class="meta-detalle__evidencia" href="{% url 'fuentes_metas_unidad' documento_principal.unidad.slug %}?anio={{ documento_principal.anio }}&amp;corte={{ documento_principal.corte }}&amp;tipo={{ indicador.codigo }}" data-entrega-editor data-editor-titulo="Evidencias · {{ indicador.nombre }}"><i class="fas fa-plus" aria-hidden="true"></i> Registrar evidencia</a></p>{% endif %}
  </template>
</div>
