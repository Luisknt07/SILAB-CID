{% load i18n %}{% comment %}Activa o desactiva un registro con un clic, junto a su botón de edición; desactivado sigue en la lista.
Recibe modulo, entidad (si el módulo la usa), registro, activo, modo (la pestaña de recursos a la que vuelve) y, si hace falta, confirmar.{% endcomment %}<button type="button" class="recursos-interruptor{% if activo %} is-activo{% endif %}" role="switch" aria-checked="{% if activo %}true{% else %}false{% endif %}" data-alternar-registro data-url="{% url 'gestion_operacion_accion' unidad.slug %}" data-modulo="{{ modulo }}" data-entidad="{{ entidad|default:'' }}" data-registro="{{ registro }}" data-modo-recursos="{{ modo }}"{% if confirmar and activo %} data-confirmar="{{ confirmar }}"{% endif %} title="{% if activo %}{% translate 'Activo: pulse para desactivar' %}{% else %}{% translate 'Inactivo: pulse para activar' %}{% endif %}"><span aria-hidden="true"></span>{% if activo %}{% translate "Activo" %}{% else %}{% translate "Inactivo" %}{% endif %}</button>
