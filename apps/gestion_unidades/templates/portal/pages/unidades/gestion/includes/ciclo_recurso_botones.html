{% load i18n %}{% if not activo %}<a class="recurso-ciclo-accion" href="{% url 'ciclo_recurso_unidad' unidad.slug tipo registro %}#solicitar">{% translate "Solicitar compra" %}</a>{% endif %}{% if tipo == 'equipo' and equipo %}<button type="button" class="recurso-ciclo-accion" data-agenda-operation-open="baja_equipo" data-field-registro_id="{{ equipo.pk }}" data-field-equipo_codigo="{{ equipo.codigo_unidad }} · {{ equipo.equipo.nombre }}"{% if equipo.fecha_baja %} data-field-fecha_baja="{{ equipo.fecha_baja|date:'Y-m-d' }}" data-field-motivo_baja="{{ equipo.motivo_baja }}" data-field-observacion_baja="{{ equipo.observacion_baja }}" data-field-reemplazado_por="{{ equipo.reemplazado_por_id|default:'' }}"{% endif %}>{% if equipo.fecha_baja %}{% translate "Corregir la baja" %}{% else %}{% translate "Dar de baja" %}{% endif %}</button>{% endif %}<a class="recurso-ciclo-accion is-eliminar" href="{% url 'ciclo_recurso_unidad' unidad.slug tipo registro %}#eliminar">{% translate "Eliminar" %}</a>
