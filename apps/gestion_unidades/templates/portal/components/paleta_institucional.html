}
{% if paleta_institucional.escala_fuente %}html { font-size: {{ componentes.escala_fuente }}%; }{% endif %}
{% if componentes.fuente_cuerpo %}body, button, input, select, textarea, table, p, th, td, label { font-family: var(--institucion-fuente-cuerpo) !important; }{% endif %}
{% if componentes.fuente_titulos %}h1, h2, h3, h4, h5, h6 { font-family: var(--institucion-fuente-titulos) !important; }{% endif %}

.citt-admin-brand__mark { background: var(--institucion-oscuro); border-color: var(--institucion-acento); }
{% if paleta_institucional.degradado_primario %}
.citt-admin-brand__mark { background-image: var(--institucion-degradado-bandas); }

{% endif %}
@media (max-width: 1199.98px) { .home-top .home-menu { background: var(--institucion-oscuro); } }

{% endif %}
